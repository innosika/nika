services:
  web:
    image: ostis/sc-web:0.9.0
    build:
      context: ./sc-web
      dockerfile: ./Dockerfile
    container_name: nika-sc-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - 8000
    networks:
      - nika
    command:
      - "--server-host=problem-solver"
    depends_on:
      problem-solver:
        condition: service_healthy

  problem-solver:
    # This image is not published on Docker Hub (ostis/nika has no 0.2.x tags),
    # so it is always built locally. `docker compose pull` skips it.
    image: ostis/nika:0.2.2
    build:
      context: ./
      dockerfile: ./Dockerfile
      args:
        # release (default): sc-machine/scl-machine from GitHub releases, no conan.ostis.net.
        # conan: the upstream way via the ostis-ai Conan remote (see Dockerfile).
        OSTIS_DEPS: ${OSTIS_DEPS:-release}
        CONAN_INSECURE_REMOTE: ${CONAN_INSECURE_REMOTE:-0}
    pull_policy: build
    container_name: nika-problem-solver
    restart: unless-stopped
    volumes:
      - ./knowledge-base:/nika/knowledge-base
      - kb-binary:/nika/kb.bin
      - ./repo.path:/nika/repo.path
      - ./nika.ini:/nika/nika.ini
    networks:
      - nika
    ports:
      - "8090:8090"
    expose:
      - 8090
    healthcheck:
      test: "bash -c 'source /nika/.venv/bin/activate && python3 /nika/scripts/healthcheck.py'"
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 120s
    environment:
      # Use the commented env variable if you need to rebuild KB every startup.
      - "REBUILD_KB=1"
      - "BINARY_PATH=/nika/install/sc-machine/bin"
      - "CONFIG_PATH=/nika/nika.ini"
      - "KB_PATH=/nika/repo.path"
      - "EXTENSIONS_PATH=/nika/build/Release/lib/extensions;/nika/install/sc-machine/lib/extensions;/nika/install/scl-machine/lib/extensions"
      - "SC_SERVER_HOST=0.0.0.0"
    command:
      - "run"

  nika-ui:
    image: ostis/nika-ui:0.2.2
    build:
      context: ./interface
      dockerfile: ./Dockerfile
    container_name: nika-ui
    restart: unless-stopped
    ports:
      - "3033:8080"
    networks:
      - nika
    environment:
      - SOCKET_URL=ws://problem-solver:8090
      - SC_URL=ws://problem-solver:8090
      - SC_WEB_URL=http://web:8000
    depends_on:
      - web

  # Локальный Wit.ai-совместимый классификатор сообщений (замена облачного wit.ai).
  # nika.ini: [wit-ai] url = http://wit-local:8095/message. Тестовая страница — http://localhost:8095
  wit-local:
    image: nika-wit-local:1.0
    build:
      context: ./wit-local
    container_name: nika-wit-local
    restart: unless-stopped
    ports:
      - "8095:8095"
    volumes:
      - ./knowledge-base:/kb:ro
      - wit-local-data:/data
    environment:
      - "SC_SERVER_URL=ws://problem-solver:8090"
      - "REFRESH_SECONDS=120"
    networks:
      - nika

  py-sc-server:
    image: ostis/nika-py-agents:0.2.2
    build:
      context: ./
      dockerfile: ./problem-solver/py/Dockerfile
    container_name: py-sc-server
    restart: unless-stopped
    depends_on:
      problem-solver:
        condition: service_healthy
    command:
      - "--host=problem-solver"
    networks:
      - nika

volumes:
  kb-binary: {}
  wit-local-data: {}

networks:
  nika: {}
